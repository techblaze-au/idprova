[package]
name = "idprova-webbotauth"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/idprova-webbotauth"
authors.workspace = true
keywords = ["identity", "web-bot-auth", "http-signatures", "rfc-9421", "jwks"]
categories = ["authentication", "cryptography"]
readme = "README.md"
description = "Web Bot Auth and RFC 9421 HTTP Message Signatures for IDProva agents"

[dependencies]
# Workspace Core
idprova-core = { path = "../idprova-core", version = "0.1.1" }

# Structured Fields (RFC 8941)
sfv = "0.1"

# Crypto
ed25519-dalek.workspace = true
zeroize.workspace = true

# Serialization
serde.workspace = true
serde_json.workspace = true
base64.workspace = true

# Time
chrono.workspace = true

# Error Handling
thiserror.workspace = true

[dev-dependencies]
proptest.workspace = true
tokio = { workspace = true, features = ["test-util", "macros"] }
